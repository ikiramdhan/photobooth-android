name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Terbitkan APK terbaru
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk photobooth.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest photobooth.apk \
            --title "Photobooth terbaru" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. Unduh photobooth.apk dan pasang di tablet." \
            --target "$GITHUB_SHA"
